<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>宜蘭高中活動相簿 iframe 手機測試</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; }
    .album-frame {
      display: block;
      width: 100%;
      height: 270px;
      border: 0;
      margin: 0;
      padding: 0;
      pointer-events: auto;
      touch-action: auto;
    }
    @media (max-width: 600px) {
      .album-frame { height: 150px; }
    }
  </style>
</head>
<body>
  <div style="margin:0;padding:0;width:100%;">
    <iframe class="album-frame" src="https://reurl.cc/VnOb3R" title="宜蘭高中活動相簿"></iframe>
  </div>
</body>
</html>
